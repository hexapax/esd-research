5-05-26", "year": 2025, "effective": "2025-05-26", "popup": "<div style=\"font-family:system-ui,sans-serif;font-size:13px;max-width:340px;line-height:1.35;\"><div style=\"font-weight:700;color:#1F2A44;font-size:14px;margin-bottom:4px;\">2025-05-26 &mdash; Splash in the Boro Waterpark, Mill Creek Regional Park, Wave pool (19,500 sq ft, opened 2017), Statesboro, Bulloch, GA</div><div style=\"color:#55607A;margin-bottom:6px;\">Outcome: <b>0</b> fatal / <b>0</b> injury / <b>5</b> near-miss</div><div style=\"margin-bottom:6px;\"><b>People:</b><br>Unknown (Unknown) — near-miss<br>Unknown (Unknown) — near-miss<br>Unknown (Unknown) — near-miss<br>Unknown (Unknown) — near-miss<br>Unknown (Unknown) — near-miss</div><div style=\"margin-bottom:6px;\"><b>Electrical:</b> pool_equipment<br><i>Blower unit shorted or overheated causing electrical current in wave pool. Electricians lifted, cleaned, and replaced necessary wires. Georgia Power conducted independent inspection and deemed systems operating within standard levels.</i></div><div style=\"margin-bottom:4px;\"><b>Verification:</b> CONFIRMED &nbsp;|&nbsp; <b>ESDPA-listed:</b> No</div><div style=\"margin-top:6px;\"><b>Sources:</b> <a href=\"https://www.wtoc.com/2025/05/27/statesboro-mother-speaks-out-after-reports-electrical-shock-local-wave-pool/\" target=\"_blank\" rel=\"noopener\">WTOC</a> &nbsp;·&nbsp; <a href=\"https://www.wjcl.com/article/splash-in-the-boro-wave-pool-closed/64921999\" target=\"_blank\" rel=\"noopener\">WJCL</a> &nbsp;·&nbsp; <a href=\"https://www.independent.co.uk/news/world/americas/georgia-wave-pool-electric-shocks-b2760306.html\" target=\"_blank\" rel=\"noopener\">The Independent</a> &nbsp;·&nbsp; <a href=\"https://www.statesboroherald.com/local/inspection-of-wave-pool-at-splash-in-the-boro-finds-no-electrical-issues-but-pool-will-remain-closed/\" target=\"_blank\" rel=\"noopener\">Statesboro Herald</a></div><div style=\"color:#8892A6;font-size:11px;margin-top:6px;\">ESD-2025-05-26-1</div></div>", "tooltip": "2025-05-26 — Wave pool (19,500 sq ft, opened 2017)"}, {"id": "ESD-2025-06-21-1", "lat": 34.8413609, "lon": -84.2681038, "category": "private", "fatalities": 1, "date": "2025-06-21", "year": 2025, "effective": "2025-06-21", "popup": "<div style=\"font-family:system-ui,sans-serif;font-size:13px;max-width:340px;line-height:1.35;\"><div style=\"font-weight:700;color:#1F2A44;font-size:14px;margin-bottom:4px;\">2025-06-21 &mdash; Private dock, Blue Ridge Lake, Blue Ridge, Fannin, GA</div><div style=\"color:#55607A;margin-bottom:6px;\">Outcome: <b>1</b> fatal / <b>3</b> injury / <b>0</b> near-miss</div><div style=\"margin-bottom:6px;\"><b>People:</b><br>Unknown (13 / M) — fatal<br>Unknown (M) — injured, rescuer<br>Unknown (M) — injured, rescuer<br>Unknown (F) — injured, rescuer</div><div style=\"margin-bottom:6px;\"><b>Electrical:</b> dock_wiring<br><i>Numerous electrical deficiencies found by Fannin County official; specific details not yet public</i></div><div style=\"margin-bottom:4px;\"><b>Verification:</b> CONFIRMED &nbsp;|&nbsp; <b>ESDPA-listed:</b> Yes</div><div style=\"margin-top:6px;\"><b>Sources:</b> <a href=\"https://www.thenewsobserver.com/news-newsletter/blue-ridge-lake-death-investigated\" target=\"_blank\" rel=\"noopener\">The News Observer (Blue Ridge)</a></div><div style=\"color:#8892A6;font-size:11px;margin-top:6px;\">ESD-2025-06-21-1</div></div>", "tooltip": "2025-06-21 — Blue Ridge Lake"}, {"id": "ESD-2025-07-10-1", "lat": 41.6194572, "lon": -87.1762804, "category": "marina", "fatalities": 1, "date": "2025-07-10", "year": 2025, "effective": "2025-07-10", "popup": "<div style=\"font-family:system-ui,sans-serif;font-size:13px;max-width:340px;line-height:1.35;\"><div style=\"font-weight:700;color:#1F2A44;font-size:14px;margin-bottom:4px;\">2025-07-10 &mdash; Marina Shores at Dune Harbor, D dock, Burns Waterway, Portage, Porter, IN</div><div style=\"color:#55607A;margin-bottom:6px;\">Outcome: <b>1</b> fatal / <b>1</b> injury / <b>0</b> near-miss</div><div style=\"margin-bottom:6px;\"><b>People:</b><br>Gabriel Gonzalez (21 / M) — fatal<br>Francis Gonzalez III (23 / M) — injured, rescuer</div><div style=\"margin-bottom:6px;\"><b>Electrical:</b> shore_power<br><i>Electricity from equipment of nearby slip holder; marina lacked mandatory NEC Article 555.24 warning signs</i></div><div style=\"margin-bottom:4px;\"><b>Verification:</b> VERIFIED &nbsp;|&nbsp; <b>ESDPA-listed:</b> Yes</div><div style=\"margin-top:6px;\"><b>Sources:</b> <a href=\"https://www.nwitimes.com/news/local/crime-courts/article_744f267b-4a14-41e2-a618-64412a8f7a0a.html\" target=\"_blank\" rel=\"noopener\">NWI Times</a> &nbsp;·&nbsp; <a href=\"https://www.chicagotribune.com/2025/07/11/hebron-man-drowns-after-electric-shock-at-marina/\" target=\"_blank\" rel=\"noopener\">Chicago Tribune</a> &nbsp;·&nbsp; <a href=\"https://schaferandschaferlaw.com/blog/tragic-electrical-shock-incident-at-marina-shores-schafer-schafer-llp-files-wrongful-death-complaint/\" target=\"_blank\" rel=\"noopener\">Schafer &amp; Schafer LLP</a></div><div style=\"color:#8892A6;font-size:11px;margin-top:6px;\">ESD-2025-07-10-1</div></div>", "tooltip": "2025-07-10 — Burns Waterway"}];
const C_MARINA  = "#1B7F79";
const C_PRIVATE = "#D2553A";
const C_OTHER   = "#8892A6";

const map = L.map('map', {
  center: [37.5, -95.5],
  zoom: 5,
  preferCanvas: true,
});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

function colorFor(cat) {
  return cat === 'marina' ? C_MARINA
       : cat === 'private' ? C_PRIVATE
       : C_OTHER;
}

// Marker cluster groups per category
const clusterOpts = { disableClusteringAtZoom: 9, spiderfyOnMaxZoom: true };
const groups = {
  marina:  L.markerClusterGroup(clusterOpts),
  private: L.markerClusterGroup(clusterOpts),
  other:   L.markerClusterGroup(clusterOpts),
};

// Heat layer gradient — punchy. Starts at near-full opacity.
const HEAT_GRADIENT = {
  0.0: 'rgba(255, 237, 160, 0)',
  0.15: '#FFEDA0',
  0.3:  '#FEB24C',
  0.5:  '#FD8D3C',
  0.7:  '#F03B20',
  1.0:  '#BD0026',
};
const heatOpts = {
  radius: 28,
  blur: 18,
  minOpacity: 0.55,
  maxZoom: 10,
  gradient: HEAT_GRADIENT,
};
const heatLayers = {
  all:     L.heatLayer([], heatOpts),
  marina:  L.heatLayer([], heatOpts),
  private: L.heatLayer([], heatOpts),
  other:   L.heatLayer([], heatOpts),
};

// Build markers once; we'll add/remove by filter
const markers = INCIDENTS.map(inc => {
  const radius = 5 + 2 * Math.min(inc.fatalities || 0, 4);
  const m = L.circleMarker([inc.lat, inc.lon], {
    radius,
    color: 'white',
    weight: 1,
    fillColor: colorFor(inc.category),
    fillOpacity: 0.85,
  });
  m.bindPopup(inc.popup, { maxWidth: 380 });
  if (inc.tooltip) m.bindTooltip(inc.tooltip);
  m._incident = inc;
  return m;
});

function inRange(inc, startISO, endISO) {
  if (!inc.effective) return false;  // can't place on a date
  return inc.effective >= startISO && inc.effective <= endISO;
}

function rebuild() {
  const startISO = document.getElementById('start-date').value;
  const endISO   = document.getElementById('end-date').value;
  // Clear all
  for (const g of Object.values(groups)) g.clearLayers();
  const heatPts = { all: [], marina: [], private: [], other: [] };
  let shown = 0;

  for (const m of markers) {
    const inc = m._incident;
    if (!inRange(inc, startISO, endISO)) continue;
    groups[inc.category].addLayer(m);
    const weight = Math.max(inc.fatalities || 0, 1);
    const pt = [inc.lat, inc.lon, weight];
    heatPts.all.push(pt);
    heatPts[inc.category].push(pt);
    shown++;
  }
  heatLayers.all.setLatLngs(heatPts.all);
  heatLayers.marina.setLatLngs(heatPts.marina);
  heatLayers.private.setLatLngs(heatPts.private);
  heatLayers.other.setLatLngs(heatPts.other);
  document.getElementById('shown').textContent = shown;
}

// Initial add: marker groups on, heat-all on (prominent).
groups.marina.addTo(map);
groups.private.addTo(map);
groups.other.addTo(map);
heatLayers.all.addTo(map);

const overlays = {
  'Markers: Freshwater marina':  groups.marina,
  'Markers: Private dock':       groups.private,
  'Markers: Other':              groups.other,
  'Heatmap: All incidents':      heatLayers.all,
  'Heatmap: Freshwater marina':  heatLayers.marina,
  'Heatmap: Private dock':       heatLayers.private,
  'Heatmap: Other':              heatLayers.other,
};
L.control.layers(null, overlays, { collapsed: false, position: 'topright' }).addTo(map);

// Wire up filter
document.getElementById('start-date').addEventListener('change', rebuild);
document.getElementById('end-date').addEventListener('change', rebuild);
for (const btn of document.querySelectorAll('.filter-card .quick button')) {
  btn.addEventListener('click', () => {
    document.getElementById('start-date').value = btn.dataset.start;
    document.getElementById('end-date').value   = btn.dataset.end;
    rebuild();
  });
}

rebuild();
</script>
